name: Update App Image Tag

on:
  workflow_call:
    inputs:
      app_name:
        description: "App name (folder under environments/prod/apps/)"
        required: true
        type: string
      image_tag:
        description: "New image tag"
        required: true
        type: string
    secrets:
      platform_pat:
        required: true

permissions:
  contents: read

jobs:
  update-tag:
    runs-on: arc-runners
    steps:
      - name: Validate inputs
        env:
          TARGET_REPOSITORY: ${{ vars.K3S_PLATFORM_REPO }}
          APP_NAME: ${{ inputs.app_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -z "$TARGET_REPOSITORY" ]]; then
            echo "ERROR: vars.K3S_PLATFORM_REPO is not set at the org or repo level"
            exit 1
          fi
          if [[ ! "$APP_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "ERROR: app_name contains invalid characters: $APP_NAME"
            exit 1
          fi
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "ERROR: image_tag is empty"
            exit 1
          fi

      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.K3S_PLATFORM_REPO }}
          token: ${{ secrets.platform_pat }}

      - name: Install yq
        env:
          YQ_VERSION: v4.52.4
        run: |
          mkdir -p "$HOME/.local/bin"
          wget -qO "$HOME/.local/bin/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Update image tag
        env:
          APP_NAME: ${{ inputs.app_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          VALUES_FILE="environments/prod/apps/${APP_NAME}/values.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            echo "ERROR: Values file not found for app: ${APP_NAME}"
            exit 1
          fi
          export IMAGE_TAG
          yq -i '.platform-common.image.tag = strenv(IMAGE_TAG)' "$VALUES_FILE"

      - name: Commit and push
        env:
          APP_NAME: ${{ inputs.app_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          VALUES_FILE="environments/prod/apps/${APP_NAME}/values.yaml"
          if git diff --quiet "$VALUES_FILE"; then
            echo "Tag is already ${IMAGE_TAG}, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "chore(${APP_NAME}): update image to ${IMAGE_TAG}"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1

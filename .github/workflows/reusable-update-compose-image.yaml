name: Update Compose Image Tag

on:
  workflow_call:
    inputs:
      stack_name:
        description: "Stack name (folder under stacks/)"
        required: true
        type: string
      service_name:
        description: "Compose service key under services:"
        required: true
        type: string
      image_repository:
        description: "Full image repository, e.g. ghcr.io/markacz-software/qrx"
        required: true
        type: string
      image_tag:
        description: "New image tag"
        required: true
        type: string
    secrets:
      platform_pat:
        required: true

permissions:
  contents: read

jobs:
  update-compose-image:
    runs-on: arc-runners
    steps:
      - name: Validate inputs
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$STACK_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "ERROR: stack_name contains invalid characters: $STACK_NAME"
            exit 1
          fi
          if [[ ! "$SERVICE_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "ERROR: service_name contains invalid characters: $SERVICE_NAME"
            exit 1
          fi
          if [[ ! "$IMAGE_REPOSITORY" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "ERROR: image_repository contains invalid characters: $IMAGE_REPOSITORY"
            exit 1
          fi
          if [[ -z "$IMAGE_TAG" ]]; then
            echo "ERROR: image_tag is empty"
            exit 1
          fi

      - name: Checkout markacz-platform-docker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Markacz-Software/markacz-platform-docker
          token: ${{ secrets.platform_pat }}

      - name: Install yq
        env:
          YQ_VERSION: v4.52.4
        run: |
          mkdir -p "$HOME/.local/bin"
          wget -qO "$HOME/.local/bin/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Update image tag
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          COMPOSE_FILE="stacks/${STACK_NAME}/compose.yaml"
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "ERROR: Compose file not found for stack: ${STACK_NAME}"
            exit 1
          fi
          NEW_IMAGE="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          export SERVICE_NAME NEW_IMAGE
          yq -i '.services[strenv(SERVICE_NAME)].image = strenv(NEW_IMAGE)' "$COMPOSE_FILE"

      - name: Commit and push
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          COMPOSE_FILE="stacks/${STACK_NAME}/compose.yaml"
          if git diff --quiet "$COMPOSE_FILE"; then
            echo "Tag is already ${IMAGE_TAG}, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$COMPOSE_FILE"
          git commit -m "chore(${STACK_NAME}/${SERVICE_NAME}): update image to ${IMAGE_TAG}"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1
